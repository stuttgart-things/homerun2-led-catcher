---
name: Build & Test
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "feat/**"
      - "fix/**"
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  python-validation:
    uses: stuttgart-things/github-workflow-templates/.github/workflows/call-python-validation.yaml@main
    with:
      runs-on: dagger-labul
      module-name: homerun2-led-catcher
      python-version: "3.12-slim"
      ruff-version: "0.8.6"
      environment-name: k8s
      accept-linterrors: false
      accept-failedtests: false
    secrets: inherit
