---
name: Comment Preview URL on PR
on:
  pull_request:
    # Note: deliberately no `opened`. When a PR is created with `preview`
    # already attached, GitHub fires both `opened` and `labeled` events
    # back-to-back, and the comment template can't dedupe across two
    # near-simultaneous runs — you end up with two URL comments. The
    # `labeled` event handles the at-creation case just fine on its own.
    types: [reopened, labeled]
    branches:
      - main

jobs:
  comment:
    # `labeled`: post only when the just-added label is `preview` (the
    # label the AppSet keys on). `reopened`: post only if the PR still
    # has the `preview` label attached — `reopened` doesn't fire a
    # `labeled` event, so we have to check the current label set.
    #
    # And only when the org variable HOMERUN2_PREVIEW_DOMAIN names the cluster
    # previews run on. Unset, the comment would carry an address with no
    # domain, and a dead link is worse than no link.
    if: |
      vars.HOMERUN2_PREVIEW_DOMAIN != '' && (
        (github.event.action == 'labeled' && github.event.label.name == 'preview') ||
        (github.event.action == 'reopened' && contains(github.event.pull_request.labels.*.name, 'preview'))
      )
    uses: stuttgart-things/github-workflow-templates/.github/workflows/call-comment-preview-url.yaml@main
    with:
      hostname-prefix: led-pr
      # The preview cluster is not named here: HOMERUN2_PREVIEW_DOMAIN is an
      # org variable, so moving previews to another cluster is one value in
      # the org settings, not a commit in every component repository. The
      # ApplicationSets take the same domain from the cluster's clusterbook
      # fqdn annotation (stuttgart-things/argocd platforms/homerun2-pr-preview).
      hostname-domain: ${{ vars.HOMERUN2_PREVIEW_DOMAIN }}
      # /healthz, not the template's /health default: this component serves
      # /healthz and nothing at /health, so the default links to a 404.
      health-path: /healthz
      namespace-prefix: homerun2-led-catcher-pr
    secrets: inherit # pragma: allowlist secret
